<mat-card appearance="outlined" class="login-card">
  <mat-card-header>
    @if (!auth.isLoggedIn()) {
      <p>Please log in</p>
    }
  </mat-card-header>
  <mat-card-content>
    @if (auth.isLoggedIn()) {
      <div class="login-info">
        <p>Already logged in</p>
        <div class="login-info-actions">
          <button (click)="auth.logOut()" matButton="tonal">Log out</button>
          <button
            (click)="auth.navigateToHomePage()"
            matButton="tonal"
            matTooltip="Return back to home page"
          >
            Return back
          </button>
        </div>
      </div>
    } @else {
      <form [formGroup]="loginForm" (submit)="onSubmit()" class="login-form">
        <mat-form-field>
          <mat-label>Login</mat-label>
          <input matInput formControlName="login" />
        </mat-form-field>
        <mat-form-field>
          <mat-label>Password</mat-label>
          <input
            matInput
            [type]="hidePassword() ? 'password' : 'text'"
            formControlName="password"
          />
          <button
            matIconButton
            matSuffix
            (click)="toggleHide($event)"
            [attr.aria-label]="'Hide password'"
            [attr.aria-pressed]="hidePassword()"
          >
            <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>
        <button matButton="filled" type="submit" [disabled]="loginForm.hasError('emptyFields')">
          Log In
        </button>
      </form>
    }
    @if (loginForm.hasError('mismatchedCredentials') && isInvalid()) {
      <mat-error>Invalid login or password</mat-error>
    }
  </mat-card-content>
</mat-card>
